name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # conda-forge Python matches the environment that produced the frozen
      # figures; PDF bytes depend on the zlib build Python links against.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"

      - name: Check artifact hashes
        run: shasum -a 256 --check --strict ARTIFACT_MANIFEST.sha256

      - name: Benchmark test suites (standard library only)
        working-directory: benchmark
        run: |
          python package_test.py
          python integration_test.py
          python acquisition_test.py

      # Figures are compared byte for byte, so pin the plotting stack that
      # produced the frozen artifacts.
      - name: Reproduce paper tables and figures
        working-directory: repro
        run: |
          pip install "matplotlib==3.10.8" "numpy==2.4.1" "pillow==12.1.0"
          python verify_reproduction.py
