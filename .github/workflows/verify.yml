name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # conda-forge Python matches the environment that produced the frozen
      # figures; PDF bytes depend on the zlib build Python links against.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"

      - name: Check artifact hashes
        run: shasum -a 256 --check --strict ARTIFACT_MANIFEST.sha256

      - name: Benchmark test suites (standard library only)
        working-directory: benchmark
        run: |
          python package_test.py
          python integration_test.py
          python acquisition_test.py

      # Figures are compared byte for byte, so pin the plotting stack that
      # produced the frozen artifacts.
      - name: Reproduce paper tables and figures
        working-directory: repro
        run: |
          pip install "matplotlib==3.10.8" "numpy==2.4.1" "pillow==12.1.0" "fonttools==4.61.1" \
            "contourpy==1.3.3" "kiwisolver==1.4.9" "pyparsing==3.3.1"
          python verify_reproduction.py

      - name: Upload regenerated figures (debug)
        if: failure()
        working-directory: repro
        run: |
          for f in fig1_pipeline fig2_ap_by_cohort; do python $f.py; done
          mkdir -p ../ci-figs && cp ../paper/figures/fig1_pipeline.pdf ../paper/figures/fig2_ap_by_cohort.pdf ../ci-figs/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-figs
          path: ci-figs
